<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Owie - Settings</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23000'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3EO%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=8">
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">OW</span>
        <span class="brand-name">Owie</span>
      </div>
      <span class="ap-name">%DISPLAY_AP_NAME%</span>
    </header>

    <h1>Settings</h1>

    <form method="post" action="/settings" id="settingsForm">
      <div class="section">
        <h2 class="section-title">WiFi Options</h2>
        <div class="field">
          <label>Owie WiFi network name override</label>
          <input placeholder="WiFi network name" value="%AP_SELF_NAME%" name="apselfname">
        </div>
        <div class="field">
          <label>Password</label>
          <input placeholder="Between 8 and 31 characters" value="%AP_PASSWORD%" name="pw">
        </div>
        <div class="field">
          <label>Power (dBm)</label>
          <select value="%WIFI_POWER%" name="wifipower">
            %WIFI_POWER_OPTIONS%
          </select>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">Board Locking</h2>
        <p id="lockingMsg" class="field-hint" style="margin-bottom:12px;"></p>
        <button onclick="toggleArming(this)" id="armBtn" style="display:none" class="btn-secondary"
          data-canenable="%CAN_ENABLE_LOCKING%" data-enabled="%LOCKING_ENABLED%">
          Disabled
        </button>
      </div>

      <button>Save</button>
    </form>

    <div class="btn-row">
      <form action="/update">
        <button>Firmware Update</button>
      </form>
      <form action="/dev_settings">
        <button class="btn-secondary">Developer Settings</button>
      </form>
      <button class="btn-secondary" onclick="history.back()">Back</button>
    </div>

    <script>
      (() => {
        const cannotLockMsg = "First set WiFi password above and save settings to enable board locking.";
        const lockingEnabledMsg = "Locking is enabled! To lock the board, turn it on and off in less than 5 seconds.";
        const lockingDisabledMsg = "Locking is disabled."
        const btn = document.getElementById("armBtn");
        const lockingMsg = document.getElementById("lockingMsg");
        if (!btn.dataset.canenable) {
          lockingMsg.innerText = cannotLockMsg;
          return;
        }
        btn.removeAttribute('style');

        function updateButton() {
          const isEnabled = !!btn.dataset.enabled;
          btn.removeAttribute("disabled");
          lockingMsg.innerText = isEnabled ? lockingEnabledMsg : lockingDisabledMsg;
          btn.innerText = isEnabled ? "Disable locking" : "Enable locking";
        }
        updateButton();

        btn.onclick = () => {
          const xhr = new XMLHttpRequest();
          xhr.open("GET", "/lock?toggleArm");
          xhr.resposeType = "text";

          xhr.onload = () => {
            if (xhr.readyState !== xhr.DONE || xhr.status !== 200) {
              btn.innerText = "Error: " + xhr.status;
            } else {
              btn.dataset.enabled = xhr.responseText;
              updateButton();
            }
          };
          btn.setAttribute("disabled", "1");
          xhr.send();
        }
      })();
  //# sourceURL=settings.js
    </script>
  </main>
</body>

</html>
