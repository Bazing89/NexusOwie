<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Owie - Developer Settings</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23000'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3EO%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css?v=8">
</head>

<body>
    <main class="page">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">OW</span>
                <span class="brand-name">Owie</span>
            </div>
            <span class="ap-name">%DISPLAY_AP_NAME%</span>
        </header>

        <h1>Developer Settings</h1>

        <div class="btn-row">
            <form action="/wifi">
                <button>Wifi Configuration</button>
            </form>
            <form action="/monitor">
                <button class="btn-secondary">Monitor BMS data</button>
            </form>
            <button class="btn-secondary" onclick="history.back()">Back</button>
        </div>
    </main>
</body>

</html>
