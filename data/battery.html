<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Owie - Battery</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23000'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3EO%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="page">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">OW</span>
                <span class="brand-name">Owie</span>
            </div>
        </header>

        <h1>Battery</h1>

        <div class="section">
            <table>
                <tr>
                    <th>SOC</th>
                    <td>%OVERRIDDEN_SOC%%%</td>
                </tr>
                <tr>
                    <th>Voltage based SOC</th>
                    <td>%VOLTAGE_BASED_SOC%%%</td>
                </tr>
                <tr>
                    <th>Lowest Ah-tracked SOC</th>
                    <td>%BOTTOM_SOC%%%</td>
                </tr>
                <tr>
                    <th>Highest Ah-tracked SOC</th>
                    <td>%TOP_SOC%%%</td>
                </tr>
                <tr>
                    <th>Ah-tracked range size</th>
                    <td>%BOTTOM_MILLIAMP_HOURS% mAh</td>
                </tr>
                <tr>
                    <th>Current discharge depth</th>
                    <td>%CURRENT_MILLIAMP_HOURS% mAh</td>
                </tr>
            </table>
        </div>

        <div class="btn-row">
            <form method="post">
                <input type="hidden" name="reset_stats">
                <button>Reset stats</button>
            </form>
            <form method="post">
                <input type="hidden" name="reset_settings">
                <button class="btn-secondary">Reset Settings</button>
            </form>
            <button class="btn-secondary" onclick="history.back()">Back</button>
        </div>
    </main>
</body>

</html>
