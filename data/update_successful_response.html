<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta http-equiv="refresh" content="10;URL='/'" />
  <title>Owie Update - Success</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23000'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3EO%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="card">
    <div class="status-icon success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h1>Update Successful</h1>
    <p class="subtitle">The board is rebooting into the new firmware.</p>
    <div class="alert">
      <strong>Keep the board powered on</strong> until Owie WiFi becomes available again.
    </div>
    <p class="dropzone-hint">Redirecting in <span id="countdown">10</span>s&hellip;</p>
  </main>

  <script>
    var s = 10;
    var el = document.getElementById('countdown');
    setInterval(function () {
      s -= 1;
      if (el) el.textContent = Math.max(s, 0);
    }, 1000);
  </script>
</body>

</html>
